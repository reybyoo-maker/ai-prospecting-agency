name: Sonjaya 24x7 AI Sales Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: sonjaya-sales-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Discover, score, and queue leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          MAX_PER_RUN: "80"
          MAX_AI_PER_RUN: "60"
          SEARCH_BACKENDS: "google,brave,bing,duckduckgo"
          QUERIES_PER_RUN: "24"
          SEARCH_TIMEOUT: "25"
        run: python prospecting_engine.py
      - name: Ensure 2-hour sales automation trigger
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          r = requests.post(os.environ["SHEET_WEBHOOK_URL"], json={"token": os.environ["WEBHOOK_TOKEN"], "action": "setup_automation"}, timeout=60)
          print(r.status_code, r.text[:1000])
          r.raise_for_status()
          PY
