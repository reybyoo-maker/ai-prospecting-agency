name: Sonjaya 24x7 AI Sales Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: sonjaya-sales-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Discover, score, and queue leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          MAX_PER_RUN: "80"
          MAX_AI_PER_RUN: "60"
          SEARCH_BACKENDS: "google,brave,bing,duckduckgo"
          QUERIES_PER_RUN: "24"
          SEARCH_TIMEOUT: "25"
        run: python prospecting_engine.py
      - name: Run outbound sales stages
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, sys, time
          base = {"token": os.environ["WEBHOOK_TOKEN"]}
          url = os.environ["SHEET_WEBHOOK_URL"]

          def post(action, timeout=180, required=True, **extra):
              payload = dict(base, action=action, **extra)
              last = None
              for attempt in range(3):
                  try:
                      r = requests.post(url, json=payload, timeout=timeout)
                      print(action, r.status_code, r.text[:3000])
                      r.raise_for_status()
                      data = r.json()
                      if required and not data.get("ok"):
                          raise RuntimeError(data)
                      return data
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              if required:
                  raise last
              print("OPTIONAL_STAGE_FAILED", action, repr(last))
              return {"ok": False, "error": str(last)}

          send = post("send_queue", limit=30, timeout=180, required=True)
          post("process_followups", limit=10, timeout=120, required=True)
          post("scan_replies", limit=10, timeout=120, required=False)
          print("SALES_STAGES_OK", {"send": send})
          PY
