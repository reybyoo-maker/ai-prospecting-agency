name: AIGROWTH Automatic Scraping & Outreach

on:
  workflow_dispatch:
    inputs:
      diagnose_auth:
        description: "Run a safe auth diagnostic using an empty records payload only"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: aigrowth-dashboard-scraping
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose dashboard auth with empty payload only
        if: ${{ inputs.diagnose_auth }}
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          DASHBOARD_INGEST_URL: "https://aigrowth-owner-dashboard.reybyoo.workers.dev/api/ingest/scrape"
        run: python scripts/diagnose_dashboard_auth.py
      - name: Scrape, score, and ingest directly into the dashboard
        if: ${{ !inputs.diagnose_auth }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          DASHBOARD_INGEST_URL: "https://aigrowth-owner-dashboard.reybyoo.workers.dev/api/ingest/scrape"
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          MAX_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && '12' || '80' }}
          MAX_AI_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && '5' || '60' }}
          MAX_DAILY_SENDS: "20"
          MAX_SENDS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && '0' || '20' }}
          MIN_SCORE_TO_SEND: "75"
          CAMPAIGN_NAME: "aigrowth-prospecting"
          ENABLE_AUTO_EMAIL: ${{ github.event_name == 'workflow_dispatch' && 'false' || vars.ENABLE_AUTO_EMAIL || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SEARCH_BACKENDS: "google,brave,bing,duckduckgo"
          QUERIES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && '3' || '24' }}
          SEARCH_TIMEOUT: "25"
        run: python prospecting_engine.py
      - name: Persist encrypted delivery and opt-out state
        if: ${{ always() && !inputs.diagnose_auth }}
        run: |
          if [ ! -f runtime/prospecting-state.enc ]; then
            echo "No encrypted state file was created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/prospecting-state.enc
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git commit -m "chore: persist encrypted prospecting state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 3))"
          done
          echo "Failed to persist encrypted prospecting state after retries."
          exit 1
