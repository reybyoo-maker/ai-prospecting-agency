name: Deploy Sonjaya Pixel Office to Free Hurl

on:
  push:
    branches:
      - visual-office-free
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4

      - name: Deploy HTML to Hurl
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "https://hurl.page/deploy"             -H "Content-Type: text/html"             --data-binary @visual-office/index.html             | tee hurl-response.txt
          echo
          echo "HURL_RESPONSE=$(cat hurl-response.txt)"

