name: Deploy Sonjaya Pixel Office Free

on:
  push:
    branches:
      - visual-office-free
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v4

      - name: Deploy HTML to free PageDrop
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          html = Path("visual-office/index.html").read_text(encoding="utf-8")
          Path("payload.json").write_text(json.dumps({
            "html": html,
            "ogTitle": "Sonjaya AI — Pixel Office",
            "ogDescription": "Sonjaya AI virtual pixel office"
          }), encoding="utf-8")
          PY

          curl --fail-with-body --connect-timeout 15 --max-time 60             --resolve pagedrop.dev:443:20.79.107.13             -X POST "https://pagedrop.dev/api/v1/sites"             -H "Content-Type: application/json"             --data-binary @payload.json             | tee pagedrop-response.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("pagedrop-response.json").read_text())
          print("LIVE_URL=" + data["data"]["url"])
          print("SITE_ID=" + data["data"]["siteId"])
          PY
