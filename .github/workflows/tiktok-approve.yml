name: Sonjaya TikTok Publish (Manual Approval)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Tanggal konten yang disetujui (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish approved TikTok carousel
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          AUTO_PUBLISH_PLATFORMS: "tiktok"
          APPROVED_DATE: ${{ inputs.date }}
        run: |
          python social_publisher.py
