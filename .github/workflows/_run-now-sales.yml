name: Sonjaya NOW - Sales Bootstrap

on:
  push:

permissions:
  contents: read

jobs:
  run-now:
    if: contains(github.event.head_commit.message, '[SONJAYA_NOW_SALES_RETRY]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Discover, score, and queue leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          MAX_PER_RUN: "80"
          MAX_AI_PER_RUN: "60"
          SEARCH_BACKENDS: "google,brave,bing,duckduckgo"
          QUERIES_PER_RUN: "24"
          SEARCH_TIMEOUT: "25"
        run: python prospecting_engine.py
      - name: Run automated sales cycle
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, sys
          r = requests.post(
              os.environ["SHEET_WEBHOOK_URL"],
              json={"token": os.environ["WEBHOOK_TOKEN"], "action": "sales_cycle"},
              timeout=300
          )
          print(r.status_code, r.text[:5000])
          r.raise_for_status()
          data = r.json()
          if not data.get("ok"):
              print("SALES_CYCLE_FAILED", data)
              sys.exit(1)
          PY
