name: Sonjaya NOW - Send Existing Ready Leads

on:
  push:

permissions:
  contents: read

jobs:
  run-now:
    if: contains(github.event.head_commit.message, '[SONJAYA_NOW_SEND]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Send existing READY leads
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          r=requests.post(
              os.environ["SHEET_WEBHOOK_URL"],
              json={"token":os.environ["WEBHOOK_TOKEN"],"action":"send_queue","limit":30},
              timeout=180
          )
          print(r.status_code, r.text[:8000])
          r.raise_for_status()
          data=r.json()
          if not data.get("ok"):
              raise SystemExit("SEND_QUEUE_FAILED: "+str(data))
          PY
