name: Sonjaya Daily Content Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1 * * *"

permissions:
  contents: write

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate local content assets and manifest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: "main"
        run: python content_runner.py
      - name: Save content assets and manual-upload manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add carousels content_manifest.json
          git diff --cached --quiet || git commit -m "chore: update daily content assets [skip ci]"
          git push
      - name: Content Studio complete
        run: echo "Assets are stored in GitHub for manual upload. No spreadsheet, auto-publishing, or social messaging integration is enabled."
