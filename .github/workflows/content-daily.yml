name: Sonjaya Daily Content + Auto Publishing

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1 * * *"

permissions:
  contents: write

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate 7-day content plan and carousel files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: "main"
        run: python content_runner.py
      - name: Save carousel assets and publish manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carousels publish_manifest.json
          git diff --cached --quiet || git commit -m "chore: update daily content assets"
          git push

      - name: Wait for public GitHub asset URLs
        run: sleep 10

      - name: Auto-publish today's post to social channels
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          AUTO_PUBLISH_PLATFORMS: "instagram,tiktok"
        run: python social_publisher.py
