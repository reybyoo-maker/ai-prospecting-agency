name: Sonjaya Daily Social Content and Publishing

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1 * * *"

permissions:
  contents: write

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate 7-day Instagram and TikTok calendar plus assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: "main"
        run: python content_runner.py
      - name: Publish assets to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_assets
          git diff --cached --quiet || git commit -m "chore: update daily social assets"
          git push
      - name: Wait for raw asset propagation
        run: sleep 10
      - name: Publish due social posts
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python social_dispatch.py
